<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Austin, Texas skyline with a construction crane">
  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f9aa8"/>
      <stop offset="55%" stop-color="#4a5460"/>
      <stop offset="100%" stop-color="#1b2028"/>
    </linearGradient>
    <linearGradient id="towerBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6672"/>
      <stop offset="100%" stop-color="#161a20"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="skyfade">
      <rect x="0" y="0" width="1600" height="420" fill="url(#fade)"/>
    </mask>
  </defs>

  <g mask="url(#skyfade)">

    <!-- ── Back layer: distant towers ── -->
    <g fill="url(#towerBack)" opacity=".55">
      <rect x="40"  y="250" width="54"  height="170"/>
      <rect x="112" y="285" width="40"  height="135"/>
      <rect x="300" y="262" width="46"  height="158"/>
      <rect x="620" y="240" width="52"  height="180"/>
      <rect x="905" y="268" width="44"  height="152"/>
      <rect x="1180" y="248" width="58" height="172"/>
      <rect x="1400" y="278" width="48" height="142"/>
      <rect x="1500" y="258" width="62" height="162"/>
    </g>

    <!-- ── Texas State Capitol ── -->
    <g fill="url(#tower)">
      <rect x="170" y="330" width="120" height="90"/>
      <rect x="205" y="300" width="50"  height="40"/>
      <path d="M230 258 c22 0 34 22 34 44 h-68 c0-22 12-44 34-44 z"/>
      <rect x="227" y="238" width="6" height="24"/>
      <circle cx="230" cy="234" r="5"/>
    </g>

    <!-- ── Frost Bank Tower: the crown with the notch ── -->
    <g fill="url(#tower)">
      <rect x="380" y="196" width="96" height="224"/>
      <path d="M380 196 l48-58 48 58 z"/>
      <path d="M404 158 l24-30 24 30 -24 20 z" fill="#0d1116" opacity=".85"/>
      <rect x="426" y="96" width="4" height="34"/>
    </g>

    <!-- ── The Independent: offset stacked blocks ── -->
    <g fill="url(#tower)">
      <rect x="520" y="300" width="88" height="120"/>
      <rect x="512" y="240" width="88" height="62"/>
      <rect x="528" y="180" width="88" height="62"/>
      <rect x="516" y="120" width="88" height="62"/>
      <rect x="556" y="92"  width="4"  height="30"/>
    </g>

    <!-- ── Austonian ── -->
    <g fill="url(#tower)">
      <rect x="700" y="150" width="74" height="270" rx="6"/>
      <rect x="716" y="126" width="42" height="26" rx="4"/>
      <rect x="735" y="86"  width="4"  height="42"/>
    </g>

    <!-- ── 360 Condos ── -->
    <g fill="url(#tower)">
      <rect x="810" y="212" width="66" height="208"/>
      <path d="M810 212 h66 v-16 l-33 -20 -33 20 z"/>
      <rect x="841" y="150" width="3" height="28"/>
    </g>

    <!-- ── Mid-rise cluster ── -->
    <g fill="url(#tower)">
      <rect x="960"  y="286" width="72" height="134"/>
      <rect x="1046" y="252" width="58" height="168"/>
      <rect x="1118" y="304" width="50" height="116"/>
    </g>

    <!-- ── Tower under construction: exposed frame ── -->
    <g stroke="#6f7a86" stroke-width="3" fill="none" opacity=".95">
      <rect x="1250" y="180" width="110" height="240"/>
      <line x1="1250" y1="220" x2="1360" y2="220"/>
      <line x1="1250" y1="260" x2="1360" y2="260"/>
      <line x1="1250" y1="300" x2="1360" y2="300"/>
      <line x1="1250" y1="340" x2="1360" y2="340"/>
      <line x1="1250" y1="380" x2="1360" y2="380"/>
      <line x1="1287" y1="180" x2="1287" y2="420"/>
      <line x1="1323" y1="180" x2="1323" y2="420"/>
      <line x1="1250" y1="180" x2="1287" y2="220"/>
      <line x1="1323" y1="260" x2="1360" y2="300"/>
      <line x1="1287" y1="340" x2="1323" y2="380"/>
    </g>

    <!-- ── Construction crane ── -->
    <g stroke="#c8a84b" stroke-width="3.5" fill="none">
      <!-- mast -->
      <line x1="1305" y1="150" x2="1305" y2="420"/>
      <line x1="1293" y1="150" x2="1293" y2="420" stroke-width="2.5" opacity=".8"/>
      <!-- mast lattice -->
      <g stroke-width="1.8" opacity=".75">
        <line x1="1293" y1="180" x2="1305" y2="202"/>
        <line x1="1305" y1="180" x2="1293" y2="202"/>
        <line x1="1293" y1="224" x2="1305" y2="246"/>
        <line x1="1305" y1="224" x2="1293" y2="246"/>
        <line x1="1293" y1="268" x2="1305" y2="290"/>
        <line x1="1305" y1="268" x2="1293" y2="290"/>
        <line x1="1293" y1="312" x2="1305" y2="334"/>
        <line x1="1305" y1="312" x2="1293" y2="334"/>
      </g>
      <!-- jib -->
      <line x1="1140" y1="150" x2="1420" y2="150"/>
      <line x1="1140" y1="150" x2="1299" y2="122"/>
      <line x1="1420" y1="150" x2="1299" y2="122"/>
      <line x1="1299" y1="122" x2="1299" y2="150"/>
      <!-- jib lattice -->
      <g stroke-width="1.6" opacity=".7">
        <line x1="1180" y1="150" x2="1210" y2="136"/>
        <line x1="1240" y1="150" x2="1210" y2="136"/>
        <line x1="1240" y1="150" x2="1270" y2="128"/>
        <line x1="1340" y1="150" x2="1370" y2="140"/>
        <line x1="1400" y1="150" x2="1370" y2="140"/>
      </g>
      <!-- hoist line and hook -->
      <line x1="1196" y1="150" x2="1196" y2="252" stroke-width="2"/>
      <path d="M1190 252 h12 v10 a6 6 0 0 1 -12 0 z" fill="#c8a84b" stroke="none"/>
      <!-- counterweight -->
      <rect x="1400" y="142" width="26" height="18" fill="#c8a84b" stroke="none" opacity=".9"/>
    </g>

    <!-- ── Second crane, further back ── -->
    <g stroke="#8f9aa8" stroke-width="2.2" fill="none" opacity=".5">
      <line x1="640" y1="196" x2="640" y2="420"/>
      <line x1="540" y1="196" x2="760" y2="196"/>
      <line x1="540" y1="196" x2="636" y2="176"/>
      <line x1="760" y1="196" x2="636" y2="176"/>
      <line x1="580" y1="196" x2="580" y2="256" stroke-width="1.6"/>
    </g>

    <!-- ── Aircraft warning lights ── -->
    <g fill="#e4c76b">
      <circle cx="428" cy="96"  r="3.2"/>
      <circle cx="558" cy="92"  r="3.2"/>
      <circle cx="737" cy="86"  r="3.2"/>
      <circle cx="1299" cy="120" r="3.6"/>
    </g>

    <!-- ── Lit windows ── -->
    <g fill="#dfe7f2">
      <g opacity=".22">
        <rect x="392" y="226" width="7" height="11"/><rect x="410" y="252" width="7" height="11"/>
        <rect x="440" y="226" width="7" height="11"/><rect x="452" y="284" width="7" height="11"/>
        <rect x="392" y="316" width="7" height="11"/><rect x="428" y="348" width="7" height="11"/>
        <rect x="536" y="196" width="7" height="11"/><rect x="568" y="256" width="7" height="11"/>
        <rect x="584" y="316" width="7" height="11"/><rect x="540" y="356" width="7" height="11"/>
        <rect x="716" y="186" width="7" height="11"/><rect x="748" y="232" width="7" height="11"/>
        <rect x="716" y="300" width="7" height="11"/><rect x="740" y="366" width="7" height="11"/>
        <rect x="826" y="248" width="7" height="11"/><rect x="852" y="300" width="7" height="11"/>
        <rect x="826" y="360" width="7" height="11"/>
        <rect x="978" y="312" width="7" height="11"/><rect x="1006" y="356" width="7" height="11"/>
        <rect x="1060" y="284" width="7" height="11"/><rect x="1084" y="340" width="7" height="11"/>
        <rect x="196" y="356" width="7" height="11"/><rect x="248" y="356" width="7" height="11"/>
      </g>
      <g opacity=".40">
        <rect x="420" y="200" width="7" height="11"/><rect x="464" y="324" width="7" height="11"/>
        <rect x="552" y="140" width="7" height="11"/><rect x="596" y="272" width="7" height="11"/>
        <rect x="732" y="160" width="7" height="11"/><rect x="722" y="404" width="7" height="11"/>
        <rect x="840" y="220" width="7" height="11"/>
        <rect x="1068" y="264" width="7" height="11"/>
      </g>
    </g>
  </g>
</svg>
